<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="35" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Enterprise AI Workflow Automation - Architecture</text>

  <!-- Employee -->
  <rect x="420" y="60" width="160" height="50" rx="8" fill="#4361ee"/>
  <text x="500" y="90" font-size="14" fill="white" text-anchor="middle">Employee Request</text>

  <!-- Channels -->
  <rect x="350" y="140" width="300" height="45" rx="8" fill="#4895ef"/>
  <text x="500" y="168" font-size="13" fill="white" text-anchor="middle">Slack / Email / Web Form</text>

  <!-- Webhook -->
  <rect x="380" y="215" width="240" height="45" rx="8" fill="#4cc9f0"/>
  <text x="500" y="243" font-size="13" fill="#1a1a2e" text-anchor="middle">n8n Webhook Trigger</text>

  <!-- OpenAI -->
  <rect x="350" y="290" width="300" height="60" rx="8" fill="#7209b7"/>
  <text x="500" y="315" font-size="13" fill="white" text-anchor="middle">OpenAI Classification</text>
  <text x="500" y="333" font-size="11" fill="#e0d4f7" text-anchor="middle">category, priority, summary, response</text>

  <!-- Switch -->
  <polygon points="500,370 580,400 500,430 420,400" fill="#f72585"/>
  <text x="500" y="404" font-size="12" fill="white" text-anchor="middle">Route by</text>
  <text x="500" y="418" font-size="12" fill="white" text-anchor="middle">Department</text>

  <!-- 4 Department boxes -->
  <rect x="60" y="470" width="180" height="50" rx="8" fill="#3a0ca3"/>
  <text x="150" y="500" font-size="13" fill="white" text-anchor="middle">IT &#8594; Jira Ticket</text>

  <rect x="280" y="470" width="180" height="50" rx="8" fill="#3a0ca3"/>
  <text x="370" y="500" font-size="13" fill="white" text-anchor="middle">HR &#8594; Email Team</text>

  <rect x="500" y="470" width="180" height="50" rx="8" fill="#3a0ca3"/>
  <text x="590" y="495" font-size="13" fill="white" text-anchor="middle">Finance &#8594;</text>
  <text x="590" y="510" font-size="13" fill="white" text-anchor="middle">Google Sheet</text>

  <rect x="720" y="470" width="200" height="50" rx="8" fill="#3a0ca3"/>
  <text x="820" y="500" font-size="13" fill="white" text-anchor="middle">Procurement &#8594; Email</text>

  <!-- High priority branch -->
  <rect x="350" y="550" width="160" height="45" rx="8" fill="#e63946"/>
  <text x="430" y="578" font-size="12" fill="white" text-anchor="middle">If High Priority</text>
  <text x="430" y="591" font-size="10" fill="#ffd6d6" text-anchor="middle">Slack Manager Alert</text>

  <rect x="540" y="550" width="160" height="45" rx="8" fill="#2b9348"/>
  <text x="620" y="578" font-size="12" fill="white" text-anchor="middle">Audit Log</text>
  <text x="620" y="591" font-size="10" fill="#d8f3dc" text-anchor="middle">Google Sheets</text>

  <!-- Arrows -->
  <g stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="500" y1="110" x2="500" y2="138"/>
    <line x1="500" y1="185" x2="500" y2="213"/>
    <line x1="500" y1="260" x2="500" y2="288"/>
    <line x1="500" y1="350" x2="500" y2="368"/>
    <line x1="460" y1="420" x2="150" y2="468"/>
    <line x1="480" y1="425" x2="370" y2="468"/>
    <line x1="520" y1="425" x2="590" y2="468"/>
    <line x1="540" y1="420" x2="820" y2="468"/>
    <line x1="150" y1="520" x2="430" y2="548"/>
    <line x1="430" y1="595" x2="620" y2="595"/>
    <line x1="370" y1="520" x2="430" y2="548"/>
    <line x1="590" y1="520" x2="620" y2="548"/>
    <line x1="820" y1="520" x2="620" y2="548"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
</svg>
